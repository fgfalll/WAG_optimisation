<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" stroke-dasharray="2 2" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- Title -->
  <text x="500" y="40" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">CO₂ EOR Optimizer Architecture & Execution Reality</text>
  <text x="500" y="65" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">Active Production Pipeline vs Orphaned Numerical Engines</text>

  <!-- UI Subsystem -->
  <g filter="url(#shadow)">
    <rect x="380" y="90" width="240" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="500" y="118" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#312e81">PyQt6 UI Layer</text>
    <text x="500" y="138" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#4338ca">main.py / ui/main_window.py</text>
  </g>

  <!-- Optimization Subsystem -->
  <g filter="url(#shadow)">
    <rect x="360" y="190" width="280" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="500" y="218" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Optimization Orchestrator</text>
    <text x="500" y="238" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#1d4ed8">core/optimisation_engine.py (GA, BO, PSO, DE)</text>
  </g>

  <!-- Engine Factory -->
  <g filter="url(#shadow)">
    <rect x="380" y="290" width="240" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="500" y="315" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">Engine Factory</text>
    <text x="500" y="330" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle" fill="#92400e">core/engine_factory.py</text>
  </g>

  <!-- ACTIVE ENGINE: Surrogate -->
  <g filter="url(#shadow)">
    <rect x="320" y="380" width="360" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="500" y="405" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">ACTIVE SOURCE OF TRUTH (100% of runs)</text>
    <text x="500" y="425" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#166534">core/engine_surrogate/ (SurrogateEngineWrapper)</text>
    
    <rect x="340" y="440" width="150" height="40" rx="6" fill="#bbf7d0" stroke="#15803d"/>
    <text x="415" y="458" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#14532d">analytical_models.py</text>
    <text x="415" y="472" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle" fill="#166534">Koval &amp; PhD Hybrid RF</text>

    <rect x="510" y="440" width="150" height="40" rx="6" fill="#bbf7d0" stroke="#15803d"/>
    <text x="585" y="458" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#14532d">profile_generator_fast.py</text>
    <text x="585" y="472" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle" fill="#166534">WAG Rates &amp; Trapping</text>

    <rect x="340" y="490" width="320" height="30" rx="4" fill="#86efac" stroke="#15803d"/>
    <text x="500" y="510" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#14532d">0D Reservoir Tank ODE (scipy BDF solve_ivp)</text>
  </g>

  <!-- ORPHANED ENGINES -->
  <g filter="url(#shadow)">
    <rect x="30" y="380" width="230" height="110" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="145" y="405" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">ORPHANED ENGINE 1</text>
    <text x="145" y="425" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b91c1c">core/compositional_engine/</text>
    <text x="145" y="445" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle" fill="#7f1d1d">1D Finite Volume Flow</text>
    <text x="145" y="465" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle" fill="#7f1d1d">Used only in validation/ scripts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="380" width="230" height="110" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="855" y="405" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">ORPHANED ENGINE 2</text>
    <text x="855" y="425" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b91c1c">core/unified_engine/</text>
    <text x="855" y="445" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle" fill="#7f1d1d">3D Grids, Solvers, Geomechanics</text>
    <text x="855" y="465" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle" fill="#7f1d1d">Only physics/eos is active</text>
  </g>

  <!-- Objectives & Evaluation -->
  <g filter="url(#shadow)">
    <rect x="350" y="580" width="300" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="500" y="605" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Multi-Objective Scoring &amp; Constraints</text>
    <text x="500" y="625" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle" fill="#334155">core/objectives/wrapper.py (NPV, RF, Storage Efficiency)</text>
  </g>

  <!-- Connectors -->
  <line x1="500" y1="150" x2="500" y2="190" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="250" x2="500" y2="290" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="340" x2="500" y2="380" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="430" y1="340" x2="160" y2="380" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-red)"/>
  <line x1="570" y1="340" x2="840" y2="380" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow-red)"/>
  <line x1="500" y1="530" x2="500" y2="580" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
