site_name: CO₂ EOR Optimizer — Technical Documentation
site_description: >-
  Two engines under one roof. The SHIPPED Python/PyQt6 surrogate engine, and the
  3D THMC reservoir simulator (the "compositional engine") currently in heavy
  development in Rust. Architecture, physics, build plan, and the full audit trail.
site_url: https://fgfalll.github.io/WAG_optimisation/
repo_url: https://github.com/fgfalll/WAG_optimisation
repo_name: fgfalll/WAG_optimisation
edit_uri: edit/main/agent_wiki/

# MkDocs reads docs from agent_wiki/ — single source of truth, no duplication
docs_dir: agent_wiki
site_dir: site

# ── Build strictness.
#    NOT `strict: true`, deliberately. 33 link warnings are pre-existing and structural:
#    docs_dir is `agent_wiki/`, so Python-side pages that link to source files (`../../core/*.py`),
#    CSVs (`audit/parameter_provenance.csv`) and repo-root audits (`../res_audit.md`) point
#    outside the docs tree. Resolving them would mean either moving files into agent_wiki/
#    (duplicating the single source of truth) or rewriting the Python-side docs.
#    Verified 09-10-2026: 0 warnings originate from compositional/ or thmc/.
strict: false

# MkDocs reads docs from agent_wiki/ — single source of truth, no duplication
docs_dir: agent_wiki
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    logo: material/molecule-co2
    admonition:
      note: fontawesome/solid/note-sticky
      warning: fontawesome/solid/triangle-exclamation
      danger: fontawesome/solid/skull-crossbones
  # Status banner — rendered on EVERY page. The repository is under massive
  # active development and nothing about the Rust engine is a shipped fact.
  banner: |
    ⚠️ **Under heavy active development.** A **3D THMC reservoir simulator is being built from scratch in Rust** — [no engine code exists yet](https://fgfalll.github.io/WAG_optimisation/compositional/). Pages describing it are **specifications and audit trails, not reports of running software**. The 🐍 **Python engine** pages describe the shipped surrogate.

plugins:
  - search:
      lang: en
  - tags

markdown_extensions:
  # Math support (LaTeX via MathJax)
  - pymdownx.arithmatex:
      generic: true
  # Syntax highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Mermaid diagrams and code blocks
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Admonitions (Note, Warning, Caution, etc.)
  - admonition
  - pymdownx.details
  # Tables, task lists, etc.
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  # Table of contents
  - toc:
      permalink: true
      title: On this page
  # Formatting
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - abbr

extra_javascript:
  # MathJax for LaTeX equation rendering
  - javascripts/mathjax.js
  # Status banner. See the comment header in the file for why this is a
  # script rather than `theme.banner` (pinned Material 9.5 does not wire it).
  - javascripts/status_banner.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fgfalll/WAG_optimisation
  generator: false
  status:
    active: warn
    icon: material/hammer-wrench
    title: 3D THMC engine — under active development
    url: compositional/README.md

