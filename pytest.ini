[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py

# Verbose output and coverage
addopts = -v --tb=short --strict-markers --color=yes --cov=core --cov-report=term-missing --ignore=tests/validation/test_phase3_changes.py

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# Timeout
timeout = 300

# Markers
markers =
    slow: marks tests as slow
    benchmark: marks tests as benchmark tests
    reference: marks tests as reference/validation tests
