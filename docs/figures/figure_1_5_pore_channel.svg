<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <title>Механізм капілярного відшнуровування нафти та геохімічна взаємодія</title>
  <desc>Схема порового каналу з ізольованою краплею нафти, шаром води та розчиненням карбонатного цементу</desc>

  <defs>
    <!-- Поровый канал -->
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355"/>
      <stop offset="50%" style="stop-color:#A0926D"/>
      <stop offset="100%" style="stop-color:#6B5344"/>
    </linearGradient>

    <!-- Вода -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#6BB3F0;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#4A90D9;stop-opacity:0.6"/>
    </linearGradient>

    <!-- Нафта -->
    <radialGradient id="oilGrad" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#3D2B1F"/>
      <stop offset="70%" style="stop-color:#1A0F08"/>
      <stop offset="100%" style="stop-color:#0D0705"/>
    </radialGradient>

    <!-- Карбонатний цемент -->
    <linearGradient id="cementGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8DCC8"/>
      <stop offset="100%" style="stop-color:#C4B89C"/>
    </linearGradient>

    <!-- Скеля -->
    <pattern id="rockTexture" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#A0926D"/>
      <circle cx="5" cy="5" r="2" fill="#8B7355" opacity="0.3"/>
      <circle cx="15" cy="12" r="1.5" fill="#6B5344" opacity="0.3"/>
      <circle cx="10" cy="18" r="1" fill="#8B7355" opacity="0.3"/>
    </pattern>

    <!-- Стрідка -->
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2C5F2D"/>
    </marker>

    <!-- Хвиляста стрілка -->
    <marker id="waveArrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,4 Q5,0 10,4 Q5,8 0,4" fill="none" stroke="#2C5F2D" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect width="800" height="500" fill="#FAFAFA"/>

  <!-- Заголовок -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Рисунок 1.5 – Механізм капілярного відшнуровування нафти
  </text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">
    Ефект «водяного екранування» та геохімічна взаємодія вугільної кислоти з матрицею теригенного пісковика
  </text>

  <!-- Основний поровий канал -->
  <path d="M80,120 Q150,100 250,140 Q350,180 450,150 Q550,120 650,160 Q720,190 750,170"
        stroke="url(#rockGrad)" stroke-width="120" fill="none" stroke-linecap="round"/>

  <!-- Текстура скелі всередині каналу -->
  <path d="M80,120 Q150,100 250,140 Q350,180 450,150 Q550,120 650,160 Q720,190 750,170"
        stroke="url(#rockTexture)" stroke-width="115" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Внутрішня частина каналу (вода) -->
  <path d="M95,125 Q160,108 250,145 Q345,180 445,155 Q540,128 635,162 Q705,188 735,172"
        stroke="url(#waterGrad)" stroke-width="90" fill="none" stroke-linecap="round"/>

  <!-- Крапля нафти -->
  <ellipse cx="400" cy="155" rx="55" ry="45" fill="url(#oilGrad)" stroke="#2C1810" stroke-width="2"/>
  <ellipse cx="385" cy="140" rx="15" ry="10" fill="#5C4033" opacity="0.4"/>

  <!-- Шар води навколо нафти -->
  <path d="M345,155 Q340,130 365,115 Q400,105 435,115 Q460,130 455,155"
        fill="none" stroke="#6BB3F0" stroke-width="8" stroke-opacity="0.6"/>
  <path d="M455,155 Q460,180 435,195 Q400,205 365,195 Q340,180 345,155"
        fill="none" stroke="#6BB3F0" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Крихкі частинки карбонатного цементу -->
  <ellipse cx="280" cy="165" rx="12" ry="8" fill="url(#cementGrad)" stroke="#A09070" stroke-width="1"/>
  <ellipse cx="520" cy="140" rx="10" ry="6" fill="url(#cementGrad)" stroke="#A09070" stroke-width="1"/>
  <ellipse cx="200" cy="130" rx="8" ry="5" fill="url(#cementGrad)" stroke="#A09070" stroke-width="1"/>
  <ellipse cx="600" cy="155" rx="9" ry="6" fill="url(#cementGrad)" stroke="#A09070" stroke-width="1"/>

  <!-- Частково розчинений цемент (зона розчинення) -->
  <ellipse cx="310" cy="145" rx="6" ry="4" fill="#D4C4A8" stroke="#8B7355" stroke-width="1" stroke-dasharray="2,1"/>
  <ellipse cx="490" cy="165" rx="7" ry="5" fill="#D4C4A8" stroke="#8B7355" stroke-width="1" stroke-dasharray="2,1"/>

  <!-- Вугільна кислота (HCO3-) - хвилясті стрілки -->
  <g transform="translate(320, 80)">
    <path d="M0,30 Q20,15 40,30 Q60,45 80,30" fill="none" stroke="#2C5F2D" stroke-width="2" marker-end="url(#arrowHead)"/>
    <text x="40" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C5F2D">HCO₃⁻</text>
  </g>

  <g transform="translate(450, 220)">
    <path d="M80,0 Q60,15 40,0 Q20,-15 0,0" fill="none" stroke="#2C5F2D" stroke-width="2" marker-end="url(#waveArrow)"/>
    <text x="40" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2C5F2D">H₂CO₃</text>
  </g>

  <!-- Капілярні сили -->
  <g transform="translate(140, 240)">
    <line x1="0" y1="20" x2="50" y2="20" stroke="#8B0000" stroke-width="2" marker-end="url(#arrowHead)"/>
    <line x1="50" y1="20" x2="0" y2="20" stroke="#8B0000" stroke-width="2" marker-end="url(#arrowHead)"/>
    <text x="25" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B0000">Pκ</text>
  </g>

  <g transform="translate(620, 240)">
    <line x1="0" y1="20" x2="50" y2="20" stroke="#8B0000" stroke-width="2" marker-end="url(#arrowHead)"/>
    <line x1="50" y1="20" x2="0" y2="20" stroke="#8B0000" stroke-width="2" marker-end="url(#arrowHead)"/>
    <text x="25" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B0000">Pκ</text>
  </g>

  <!-- Молекули води -->
  <g font-family="Arial, sans-serif" font-size="9" fill="#4A90D9">
    <text x="120" y="145">H₂O</text>
    <text x="180" y="165">H₂O</text>
    <text x="250" y="180">H₂O</text>
    <text x="550" y="130">H₂O</text>
    <text x="680" y="160">H₂O</text>
    <text x="720" y="140">H₂O</text>
  </g>

  <!-- Молекули нафти -->
  <g font-family="Arial, sans-serif" font-size="9" fill="#8B4513">
    <text x="370" y="145">CₙHₘ</text>
  </g>

  <!-- Зони геохімічної взаємодії -->
  <ellipse cx="310" cy="145" rx="25" ry="20" fill="none" stroke="#2C5F2D" stroke-width="1" stroke-dasharray="4,2" opacity="0.7"/>
  <ellipse cx="490" cy="165" rx="25" ry="20" fill="none" stroke="#2C5F2D" stroke-width="1" stroke-dasharray="4,2" opacity="0.7"/>

  <!-- Ліги -->
  <line x1="310" y1="125" x2="310" y2="100" stroke="#333" stroke-width="1"/>
  <text x="310" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">зона розчинення</text>

  <!-- Легенда -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="700" height="100" fill="#F5F5F5" stroke="#CCC" rx="5"/>

    <text x="350" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Легенда</text>

    <!-- Нафта -->
    <ellipse cx="50" cy="45" rx="15" ry="10" fill="url(#oilGrad)" stroke="#2C1810" stroke-width="1"/>
    <text x="75" y="50" font-family="Arial, sans-serif" font-size="10" fill="#333">Нафта (ізольована крапля)</text>

    <!-- Вода -->
    <rect x="200" y="35" width="30" height="20" fill="url(#waterGrad)" stroke="#4A90D9" stroke-width="1"/>
    <text x="240" y="50" font-family="Arial, sans-serif" font-size="10" fill="#333">Вода (плівка)</text>

    <!-- Карбонатний цемент -->
    <ellipse cx="370" cy="45" rx="12" ry="8" fill="url(#cementGrad)" stroke="#A09070" stroke-width="1"/>
    <text x="395" y="50" font-family="Arial, sans-serif" font-size="10" fill="#333">Карбонатний цемент</text>

    <!-- Вугільна кислота -->
    <path d="M510,45 Q520,35 530,45 Q540,55 550,45" fill="none" stroke="#2C5F2D" stroke-width="2"/>
    <text x="560" y="50" font-family="Arial, sans-serif" font-size="10" fill="#333">Вугільна кислота</text>

    <!-- Поровый канал -->
    <rect x="30" y="70" width="40" height="15" fill="url(#rockGrad)"/>
    <text x="80" y="82" font-family="Arial, sans-serif" font-size="10" fill="#333">Пісчаник (матриця)</text>

    <!-- Капілярні сили -->
    <line x1="200" y1="77" x2="240" y2="77" stroke="#8B0000" stroke-width="2" marker-end="url(#arrowHead)"/>
    <line x1="240" y1="77" x2="200" y2="77" stroke="#8B0000" stroke-width="2" marker-end="url(#arrowHead)"/>
    <text x="250" y="82" font-family="Arial, sans-serif" font-size="10" fill="#333">Капілярний тиск</text>

    <!-- Зона розчинення -->
    <ellipse cx="400" cy="77" rx="15" ry="10" fill="none" stroke="#2C5F2D" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="425" y="82" font-family="Arial, sans-serif" font-size="10" fill="#333">Зона геохімічної взаємодії</text>
  </g>

  <!-- Підписи елементів -->
  <g font-family="Arial, sans-serif" font-size="10">
    <text x="400" y="85" text-anchor="middle" fill="#1A0F08" font-weight="bold">КРАПЛЯ НАФТИ</text>
    <text x="400" y="230" text-anchor="middle" fill="#333">ефект "водяного екранування"</text>
    <text x="200" y="100" fill="#4A90D9">вода в пористому середовищі</text>
    <text x="600" y="100" fill="#4A90D9">вода в пористому середовищі</text>
  </g>

  <!-- Стрілки напрямку потоку -->
  <g fill="#333" font-family="Arial, sans-serif" font-size="10">
    <path d="M70,200 L50,200 L55,195 M50,200 L55,205" stroke="#333" stroke-width="1.5" fill="none"/>
    <text x="45" y="215">Q</text>

    <path d="M770,200 L750,200 L755,195 M750,200 L755,205" stroke="#333" stroke-width="1.5" fill="none"/>
    <text x="760" y="215">Q</text>
  </g>
</svg>